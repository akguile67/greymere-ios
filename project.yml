name: Greymere
options:
  bundleIdPrefix: com.greymere
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: D25P46655T
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.8.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
targetTemplates:
  App:
    type: application
    platform: iOS
    sources: [Greymere]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
targets:
  Greymere:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greymere.ios
        INFOPLIST_KEY_CFBundleDisplayName: Greymere
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Greymere/Info-Prod.plist
      properties:
        UIAppFonts: [EBGaramond-Regular.ttf, EBGaramond-SemiBold.ttf]
        NSMicrophoneUsageDescription: Greymere listens while you dictate. Audio is sent to your own Greymere server and is not stored.
        GreymereDefaultServerURL: http://100.75.100.51:3000
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.75.100.51:
              NSExceptionAllowsInsecureHTTPLoads: true
  GreymerePreProd:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greymere.ios.preprod
        INFOPLIST_KEY_CFBundleDisplayName: Greymere Pre-prod
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconPreProd
    info:
      path: Greymere/Info-PreProd.plist
      properties:
        UIAppFonts: [EBGaramond-Regular.ttf, EBGaramond-SemiBold.ttf]
        NSMicrophoneUsageDescription: Greymere listens while you dictate. Audio is sent to your own Greymere server and is not stored.
        GreymereDefaultServerURL: http://100.75.100.51:3100
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.75.100.51:
              NSExceptionAllowsInsecureHTTPLoads: true
  GreymereDev:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greymere.ios.dev
        INFOPLIST_KEY_CFBundleDisplayName: Greymere Dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
    info:
      path: Greymere/Info-Dev.plist
      properties:
        UIAppFonts: [EBGaramond-Regular.ttf, EBGaramond-SemiBold.ttf]
        NSMicrophoneUsageDescription: Greymere listens while you dictate. Audio is sent to your own Greymere server and is not stored.
        # The dev server runs on the MacBook Pro (the Godric Client (Dev) app starts it on port 3001), reached over Tailscale.
        GreymereDefaultServerURL: http://100.87.110.63:3001
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.87.110.63:
              NSExceptionAllowsInsecureHTTPLoads: true
  # THROWAWAY (ADR 0.59.0 Sprint 1, step 3): navigation-only Codex prototype with dummy data.
  # Own sources folder, own bundle ID; shares nothing with the shipped targets and is deleted after the author gate.
  GreymereCodexProto:
    type: application
    platform: iOS
    sources: [CodexPrototype]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greymere.ios.codexproto
        INFOPLIST_KEY_CFBundleDisplayName: Codex Proto
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
