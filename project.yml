name: Greymere
options:
  bundleIdPrefix: com.greymere
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: D25P46655T
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targetTemplates:
  App:
    type: application
    platform: iOS
    sources: [Greymere]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
targets:
  Greymere:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greymere.ios
        INFOPLIST_KEY_CFBundleDisplayName: Greymere
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Greymere/Info-Prod.plist
      properties:
        UIAppFonts: [EBGaramond-Regular.ttf, EBGaramond-SemiBold.ttf]
        GreymereDefaultServerURL: http://100.75.100.51:3000
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.75.100.51:
              NSExceptionAllowsInsecureHTTPLoads: true
  GreymerePreProd:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greymere.ios.preprod
        INFOPLIST_KEY_CFBundleDisplayName: Greymere Pre-prod
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconPreProd
    info:
      path: Greymere/Info-PreProd.plist
      properties:
        UIAppFonts: [EBGaramond-Regular.ttf, EBGaramond-SemiBold.ttf]
        GreymereDefaultServerURL: http://100.75.100.51:3100
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.75.100.51:
              NSExceptionAllowsInsecureHTTPLoads: true
